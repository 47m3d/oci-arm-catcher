name: Oracle Cloud ARM Catcher

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  catch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install oci-arm-catcher
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Create OCI Config
        run: |
          mkdir -p ~/.oci
          echo "[DEFAULT]" > ~/.oci/config
          echo "user=${{ secrets.OCI_USER_ID }}" >> ~/.oci/config
          echo "fingerprint=${{ secrets.OCI_FINGERPRINT }}" >> ~/.oci/config
          echo "tenancy=${{ secrets.OCI_TENANCY_ID }}" >> ~/.oci/config
          echo "region=${{ secrets.OCI_REGION }}" >> ~/.oci/config
          echo "key_file=~/.oci/oci_api_key.pem" >> ~/.oci/config
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/config/oci_api_key.pem
          chmod 600 ~/.oci/config/oci_api_key.pem

      - name: Run Catcher via Stack
        run: |
          $HOME/.local/bin/oci-arm-catcher --stack-id "${{ secrets.OCI_STACK_ID }}"
