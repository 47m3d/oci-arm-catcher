name: Oracle Cloud ARM Catcher

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  catch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Oracle Cloud CLI
        uses: oracle-actions/setup-oci-cli@v1.3.1
        with:
          user: ${{ secrets.OCI_USER_ID }}
          fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          tenancy: ${{ secrets.OCI_TENANCY_ID }}
          region: ${{ secrets.OCI_REGION }}
          api_key: ${{ secrets.OCI_PRIVATE_KEY }}

      - name: Run Stack Apply Job
        run: |
          oci resource-manager job create-apply-job --stack-id "${{ secrets.OCI_STACK_ID }}" --execution-plan-strategy FROM_PLAN_JOB_ID_OR_LATEST_SUCCESSFUL_PLAN_JOB
