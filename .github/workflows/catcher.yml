name: Oracle Cloud ARM Catcher

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  catch:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install OCI SDK
        run: pip install oci

      - name: Run Stack Apply Job via Python
        env:
          OCI_USER: ${{ secrets.OCI_USER_ID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_ID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_STACK_ID: ${{ secrets.OCI_STACK_ID }}
        run: |
          python - <<'PY'
          import os
          import oci

          config = {
              'user': os.environ['OCI_USER'],
              'fingerprint': os.environ['OCI_FINGERPRINT'],
              'tenancy': os.environ['OCI_TENANCY'],
              'region': os.environ['OCI_REGION'],
              'key_content': os.environ['OCI_KEY'].strip()
          }

          rm_client = oci.resource_manager.ResourceManagerClient(config)

          try:
              job_details = oci.resource_manager.models.CreateApplyJobOperationDetails(
                  execution_plan_strategy='AUTO_APPROVED'
              )
              request_details = oci.resource_manager.models.CreateJobDetails(
                  stack_id=os.environ['OCI_STACK_ID'],
                  operation='APPLY',
                  job_operation_details=job_details
              )
              response = rm_client.create_job(create_job_details=request_details)
              print('Job triggered successfully! ID:', response.data.id)
          except Exception as e:
              print('Oracle Response:', str(e))
          PY
