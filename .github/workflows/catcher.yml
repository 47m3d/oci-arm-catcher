name: Oracle Cloud ARM Catcher

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

concurrency:
  group: oci-catcher
  cancel-in-progress: true

jobs:
  catch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install OCI SDK
        run: pip install oci

      - name: Retry stack apply until capacity is available
        env:
          OCI_USER: ${{ secrets.OCI_USER_ID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_ID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_STACK_ID: ${{ secrets.OCI_STACK_ID }}
        run: |
          python - <<'PY'
          import os, time
          import oci

          config = {
              'user': os.environ['OCI_USER'],
              'fingerprint': os.environ['OCI_FINGERPRINT'],
              'tenancy': os.environ['OCI_TENANCY'],
              'region': os.environ['OCI_REGION'],
              'key_content': os.environ['OCI_KEY'].strip()
          }
          rm = oci.resource_manager.ResourceManagerClient(config)
          stack_id = os.environ['OCI_STACK_ID']
          deadline = time.time() + 5 * 3600 + 1800

          while time.time() < deadline:
              wait = 300
              try:
                  job = rm.create_job(oci.resource_manager.models.CreateJobDetails(
                      stack_id=stack_id,
                      operation='APPLY',
                      apply_job_plan_resolution=oci.resource_manager.models.ApplyJobPlanResolution(
                          is_auto_approved=True)
                  )).data
                  print('Job started:', job.id, flush=True)
                  while True:
                      time.sleep(15)
                      j = rm.get_job(job.id).data
                      if j.lifecycle_state in ('SUCCEEDED', 'FAILED', 'CANCELED'):
                          break
                  print('Job state:', j.lifecycle_state, flush=True)
                  if j.lifecycle_state == 'SUCCEEDED':
                      print('SERVER CREATED!')
                      raise SystemExit(0)
              except SystemExit:
                  raise
              except oci.exceptions.ServiceError as e:
                  print('Error:', e.status, e.code, flush=True)
                  if e.status == 429:
                      wait = 900
              except Exception as e:
                  print('Error:', str(e), flush=True)
              print('Waiting', wait, 'seconds before next try', flush=True)
              time.sleep(wait)
          print('Time limit reached, next scheduled run will continue.')
          PY
